name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agjob_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/agjob_ci
          JWT_SECRET: ci-test-secret-not-for-production
          JWT_EXPIRES_IN: 1h
          LOG_LEVEL: silent
          CORS_ORIGIN: "*"
          IP_HASH_SALT: ci-salt
          RATE_LIMIT_AUTH_MAX: 1000
          RATE_LIMIT_CONTACT_MAX: 1000
          NODE_ENV: test
