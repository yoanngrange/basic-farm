<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title data-i18n="auth.loginTitle">Log in</title>
  <script type="module" crossorigin src="/assets/login-D829HXd7.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/auth-Wr5UMbGd.js">
  <link rel="modulepreload" crossorigin href="/assets/api-Ca16Xt94.js">
  <link rel="stylesheet" crossorigin href="/assets/auth-Cxy5ob1T.css">
</head>
<body>
  <main class="container" style="max-width: 480px; margin-top: 3rem;">
    <h1 data-i18n="auth.loginTitle">Log in</h1>
    <form id="login-form">
      <label>
        <span data-i18n="auth.email">Email</span>
        <input type="email" name="email" required autocomplete="email" />
      </label>
      <label>
        <span data-i18n="auth.password">Password</span>
        <input type="password" name="password" required autocomplete="current-password" />
      </label>
      <p class="error-message" id="error" hidden></p>
      <button type="submit" data-i18n="auth.loginButton">Log in</button>
    </form>
    <p><span data-i18n="auth.noAccount">No account yet?</span> <a href="/register.html" data-i18n="nav.register">Sign up</a></p>
  </main>
</body>
</html>
