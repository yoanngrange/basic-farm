<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title data-i18n="dashboard.myListings">Jobs dashboard</title>
  <script type="module" src="/src/pages/dashboard-jobs.js"></script>
</head>
<body>
  <nav class="container">
    <ul><li><strong data-i18n="site.title">Basic Farm</strong></li></ul>
    <ul>
      <li><a href="dashboard.html" data-i18n="dashboard.title">Dashboard</a></li>
      <li><a href="listing-new.html" data-i18n="dashboard.newListing" role="button">New listing</a></li>
    </ul>
  </nav>

  <main class="container">
    <h1>Jobs</h1>

    <section id="farm-section">
      <h2 data-i18n="dashboard.myFarms">My farm</h2>
      <form id="farm-form">
        <div class="grid">
          <label>
            <span>Logo URL</span>
            <input type="url" name="logoUrl" placeholder="https://..." />
          </label>
          <label>
            <span data-i18n="form.farmNameLabel">Farm name</span>
            <input type="text" name="name" required />
          </label>
        </div>
        <div class="grid">
          <label>
            <span>Address</span>
            <input type="text" name="addressLine" />
          </label>
          <label>
            <span data-i18n="form.localityLabel">City / town</span>
            <input type="text" name="locality" />
          </label>
          <label>
            <span data-i18n="form.countryLabel">Country</span>
            <select name="countryCode" required>
              <option value="FR">France</option>
              <option value="ES">Spain</option>
              <option value="IT">Italy</option>
              <option value="PT">Portugal</option>
              <option value="US">United States</option>
              <option value="GB">United Kingdom</option>
              <option value="IE">Ireland</option>
              <option value="DE">Germany</option>
            </select>
          </label>
        </div>
        <div class="grid">
          <label>
            <span>Public email (shown to candidates, after verification)</span>
            <input type="email" name="contactEmail" />
          </label>
          <label>
            <span>Public phone</span>
            <input type="tel" name="contactPhone" />
          </label>
        </div>
        <p class="error-message" id="farm-error" hidden></p>
        <p id="farm-success" hidden>Saved.</p>
        <button type="submit" id="farm-submit" data-i18n="form.submit">Save</button>
      </form>
    </section>

    <section id="listings-section">
      <h2 data-i18n="dashboard.myListings">My listings</h2>
      <table>
        <thead>
          <tr>
            <th data-i18n="form.listingTitleLabel">Title</th>
            <th data-i18n="dashboard.status">Status</th>
            <th data-i18n="listing.viewCount">Views</th>
            <th data-i18n="dashboard.actions">Actions</th>
          </tr>
        </thead>
        <tbody id="listings-body"></tbody>
      </table>
      <p id="no-listings-message" data-i18n="dashboard.noListings" hidden></p>
    </section>

    <section id="contacts-section">
      <h2>Contacts received</h2>
      <table>
        <thead>
          <tr>
            <th data-i18n="form.listingTitleLabel">Listing</th>
            <th>Type</th>
            <th>Candidate email</th>
            <th>Message</th>
            <th>Date</th>
          </tr>
        </thead>
        <tbody id="contacts-body"></tbody>
      </table>
      <p id="no-contacts-message" hidden>No contacts yet.</p>
    </section>
  </main>
</body>
</html>
