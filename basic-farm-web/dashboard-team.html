<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title data-i18n="team.pageTitle">Team</title>
  <script type="module" src="/src/pages/dashboard-team.js"></script>
</head>
<body>
  <nav class="container">
    <ul><li><strong data-i18n="site.title">Basic Farm</strong></li></ul>
    <ul><li><a href="dashboard.html" data-i18n="dashboard.title">Dashboard</a></li></ul>
  </nav>

  <main class="container">
    <h1 data-i18n="team.pageTitle">Team</h1>
    <p><span data-i18n="weather.forFarm">Farm:</span> <strong id="current-farm-name"></strong></p>

    <section id="people-section">
      <h2 data-i18n="team.people">People</h2>
      <table>
        <thead>
          <tr>
            <th data-i18n="team.firstName">First name</th>
            <th data-i18n="team.lastName">Last name</th>
            <th data-i18n="team.role">Role</th>
            <th data-i18n="team.email">Email</th>
            <th data-i18n="team.phone">Phone</th>
            <th data-i18n="team.status">Status</th>
            <th data-i18n="dashboard.actions">Actions</th>
          </tr>
        </thead>
        <tbody id="people-body"></tbody>
      </table>
      <p id="no-people-message" data-i18n="team.noPeople" hidden>No one added yet.</p>

      <details>
        <summary data-i18n="team.addPerson">Add a person</summary>
        <form id="new-person-form">
          <div class="grid">
            <input type="text" name="firstName" data-i18n-placeholder="team.firstName" placeholder="First name" required />
            <input type="text" name="lastName" data-i18n-placeholder="team.lastName" placeholder="Last name" required />
            <input type="text" name="roleTitle" data-i18n-placeholder="team.role" placeholder="Role" />
          </div>
          <div class="grid">
            <input type="email" name="email" data-i18n-placeholder="team.email" placeholder="Email" />
            <input type="tel" name="phone" data-i18n-placeholder="team.phone" placeholder="Phone" />
          </div>
          <p class="error-message" id="new-person-error" hidden></p>
          <button type="submit" data-i18n="form.submit">Save</button>
        </form>
      </details>

      <details>
        <summary data-i18n="team.bulkImport">Add several at once</summary>
        <p class="hint" data-i18n="team.bulkImportHint">One person per line: First name, Last name, Role (optional).</p>
        <form id="bulk-import-form">
          <textarea name="lines" rows="5" data-i18n-placeholder="team.bulkImportPlaceholder" placeholder="Jean, Dupont, Tractoriste"></textarea>
          <p class="error-message" id="bulk-import-error" hidden></p>
          <button type="submit" data-i18n="team.bulkImportSubmit">Import</button>
        </form>
      </details>
    </section>

    <section id="teams-section">
      <h2 data-i18n="team.teams">Teams</h2>
      <div id="teams-list" class="grid"></div>
      <p id="no-teams-message" data-i18n="team.noTeams" hidden>No teams yet.</p>

      <form id="new-team-form">
        <input type="text" name="name" data-i18n-placeholder="team.newTeamPlaceholder" placeholder="New team name" required />
        <button type="submit" data-i18n="team.createTeam">Create team</button>
      </form>
    </section>

    <div id="empty-state" hidden>
      <p data-i18n="dashboard.noFarms">You haven't registered a farm yet.</p>
    </div>
  </main>
</body>
</html>
