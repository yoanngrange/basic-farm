name: CI

on:
  push:
    branches: [main]
    paths: ["basic-farm-api/**"]
  pull_request:
    branches: [main]
    paths: ["basic-farm-api/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: basic-farm-api

    services:
      postgres:
        # postgis/postgis, not plain postgres — schema.sql now does
        # CREATE EXTENSION postgis (plots.parcels stores real polygons).
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: basic_farm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: basic-farm-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/basic_farm_ci
          JWT_SECRET: ci-test-secret-not-for-production
          JWT_EXPIRES_IN: 1h
          LOG_LEVEL: silent
          CORS_ORIGIN: "*"
          IP_HASH_SALT: ci-salt
          RATE_LIMIT_AUTH_MAX: 1000
          RATE_LIMIT_CONTACT_MAX: 1000
          NODE_ENV: test
